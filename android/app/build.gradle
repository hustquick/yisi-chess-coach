plugins {
    id "com.android.application"
}

def generatedIconRes = file("$buildDir/generated/appIconRes")
def generatedLegalAssets = file("$buildDir/generated/legalAssets")

android {
    namespace "com.yisi.chesscoach"
    compileSdk 35

    defaultConfig {
        applicationId "com.yisi.chesscoach"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++20 -O3 -fexceptions -frtti"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    buildTypes {
        debug { debuggable true }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }

    sourceSets {
        main {
            // Package the same official Stockfish NNUE used by the iOS app.
            assets.srcDirs = ["src/main/assets", "../../iOS/App/Resources", generatedLegalAssets]
            res.srcDir generatedIconRes
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs { useLegacyPackaging = true }
    }
}

tasks.register("syncAppIcon", Copy) {
    from rootProject.file("../iOS/App/Resources/AppIcon.png")
    into file("$generatedIconRes/drawable-nodpi")
    rename { "ic_launcher.png" }
}

tasks.register("syncDarkAppIcon", Copy) {
    from rootProject.file("../iOS/App/Resources/AppIconDark.png")
    into file("$generatedIconRes/drawable-night-nodpi")
    rename { "ic_launcher.png" }
}

tasks.register("syncStockfishLicense", Copy) {
    from rootProject.file("../iOS/ThirdParty/Stockfish/COPYING.txt")
    into generatedLegalAssets
    rename { "STOCKFISH_LICENSE.txt" }
}

tasks.named("preBuild").configure {
    dependsOn tasks.named("syncAppIcon")
    dependsOn tasks.named("syncDarkAppIcon")
    dependsOn tasks.named("syncStockfishLicense")
}
